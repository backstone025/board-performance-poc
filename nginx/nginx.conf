events {
    worker_connections 1024;
}

http {
    # MIME 타입 정의 (image/jpeg, application/json 등 포함)
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Gzip 응답 데이터 압축 설정
    gzip on;
    gzip_comp_level 5;                     # CPU와 압축률의 효율적인 타협점
    gzip_min_length 1024;                  # 1KB 미만 극소형 데이터 제외
    gzip_types application/json image/jpeg; # JSON 및 JPEG 대조군 설정
    gzip_vary on;                          # 프록시/클라이언트 캐시 구분을 위한 Vary: Accept-Encoding 헤더 추가

    upstream backend_servers {
        server app1:8080;
        server app2:8080;
    }

    server {
        listen 80;

        # JSON API 요청 -> Spring Boot WAS 프록시
        location / {
            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 정적 이미지 요청 -> Nginx 직접 정적 응답
        location /images/ {
            alias /usr/share/nginx/html/images/;
            access_log off;
        }
    }
}