version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: simple-board-db
    environment:
      MYSQL_DATABASE: simple_board
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  redis:
    image: redis:7.0-alpine
    container_name: simple-board-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 16mb --maxmemory-policy allkeys-lru
    networks:
      - app-network

  redis-exporter:
    image: oliver006/redis_exporter:v1.50.0
    container_name: simple-board-redis-exporter
    environment:
      - REDIS_ADDR=redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      - redis
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:latest
    container_name: simple-board-prometheus
    ports:
      - "9090:9090"
    volumes:
      # prometheus.yml 파일 실제 위치가 루트에 있다면 ./prometheus.yml 로 수정해주세요!
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - app1
      - app2
      - redis-exporter
    networks:
      - app-network

  grafana:
    image: grafana/grafana:latest
    container_name: simple-board-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: simple-board-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/image:/usr/share/nginx/html/images
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
    networks:
      - app-network

  app1:
    build: .
    container_name: simple-board-app-1
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/simple_board?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 17
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_CACHE_REDIS_ENABLE_STATISTICS: "true"
      MANAGEMENT_METRICS_ENABLE_CACHE: "true"
      JAVA_OPTS: "-Xms512m -Xmx512m"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M
    networks:
      - app-network

  app2:
    build: .
    container_name: simple-board-app-2
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/simple_board?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 17
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_CACHE_REDIS_ENABLE_STATISTICS: "true"
      MANAGEMENT_METRICS_ENABLE_CACHE: "true"
      JAVA_OPTS: "-Xms512m -Xmx512m"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M
    networks:
      - app-network

volumes:
  mysql-data:

networks:
  app-network:
    driver: bridge